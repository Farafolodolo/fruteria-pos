services:
  - type: web
    name: fruteria-pos
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
